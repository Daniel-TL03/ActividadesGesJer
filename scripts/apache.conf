<VirtualHost *:80>
    ServerName TU_DOMINIO_O_IP

    # Frontend estático
    DocumentRoot /var/www/gestor-actividades/templates
    Alias /static /var/www/gestor-actividades/static

    <Directory /var/www/gestor-actividades/static>
        Require all granted
    </Directory>

    # Proxy reverso → Gunicorn (Flask) en puerto 5000
    ProxyPreserveHost On
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Seguridad
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Compresión
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/gestor-error.log
    CustomLog ${APACHE_LOG_DIR}/gestor-access.log combined
</VirtualHost>

# TLS: sudo apt install certbot python3-certbot-apache && sudo certbot --apache -d TU_DOMINIO
