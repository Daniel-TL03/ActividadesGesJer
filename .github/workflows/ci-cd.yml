name: CI/CD - Deploy a VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest --tb=short 2>/dev/null || echo "Sin tests, OK"

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sincronizar archivos
        run: |
          rsync -azh --delete \
            --exclude 'venv' --exclude '__pycache__' --exclude '.env' --exclude '.git' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/gestor-actividades/

      - name: Reiniciar servicio
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            cd /var/www/gestor-actividades &&
            source venv/bin/activate &&
            pip install -r requirements.txt &&
            sudo systemctl restart gestor-actividades &&
            sudo systemctl reload apache2
          '

      - name: Healthcheck
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            sleep 3 && curl -f http://localhost:5000/api/health
          '
