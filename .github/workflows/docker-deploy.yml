name: CI/CD - Docker Build + Deploy a Render

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t gestor-actividades .
      - name: Deploy to Render
        if: success()
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
