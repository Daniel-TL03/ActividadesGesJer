<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Operaciones</title>
<meta name="description" content="Sistema de registros. Flask + MySQL + Apache.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Variables & Reset ─────────────────────────────── */
:root {
  --bg-app: #f3f4f6;
  --bg-sidebar: #111827;
  --text-sidebar: #f9fafb;
  --text-sidebar-muted: #9ca3af;
  --bg-card: #ffffff;
  --text-main: #1f2937;
  --text-muted: #6b7280;
  --border-color: #e5e7eb;
  
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #e0e7ff;
  
  --success: #10b981;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: var(--bg-app);
  color: var(--text-main);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Layout: Sidebar ────────────────────────────────── */
.sidebar {
  display: none !important;
}

.brand {
  margin-bottom: 3rem;
}
.brand h1 {
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
  line-height: 1.2;
}
.brand h1 svg {
  width: 28px;
  height: 28px;
  color: var(--primary);
  flex-shrink: 0;
}
.brand p {
  font-size: 0.8rem;
  color: var(--text-sidebar-muted);
  margin-top: 6px;
  line-height: 1.4;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 2rem;
}
.stat-box {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 1rem;
  border-radius: var(--radius-md);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.stat-box.active {
  background: var(--primary);
  border-color: var(--primary-hover);
}
.stat-box span {
  font-size: 0.85rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.stat-box strong {
  font-size: 1.4rem;
  font-weight: 700;
}

.sidebar-footer {
  margin-top: auto;
  font-size: 0.75rem;
  color: var(--text-sidebar-muted);
  text-align: center;
  padding-top: 1rem;
  border-top: 1px solid rgba(255,255,255,0.1);
}

/* ── Layout: Main Content ────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 2.5rem 3rem;
}

.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  gap: 20px;
}

/* Buscador */
.search-box {
  position: relative;
  flex: 1;
  max-width: 400px;
}
.search-box input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  border: 1px solid var(--border-color);
  border-radius: 999px;
  font: inherit;
  font-size: 0.95rem;
  background: var(--bg-card);
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
}
.search-box input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}
.search-box svg {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text-muted);
}

/* Tabs en modo de Píldoras */
.tabs {
  display: flex;
  background: var(--border-color);
  padding: 4px;
  border-radius: 999px;
}
.tabs button {
  padding: 8px 20px;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}
.tabs button.on {
  background: var(--bg-card);
  color: var(--text-main);
  box-shadow: var(--shadow-sm);
}

/* Card Formulario */
.form-card {
  background: var(--bg-card);
  padding: 1.5rem;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  margin-bottom: 2rem;
}
.form-card h2 {
  font-size: 1.1rem;
  margin-bottom: 1rem;
  color: var(--text-main);
}
#frm {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.input-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#frm input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 0.95rem;
  transition: border-color 0.2s;
}
#frm input:focus {
  outline: none;
  border-color: var(--primary);
}
#frm input::placeholder { color: #a1a1aa; }

.form-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#frm button {
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  height: 46px;
}
#save-btn {
  background: var(--primary);
  color: #fff;
}
#save-btn:hover { background: var(--primary-hover); }
#cancel-btn {
  background: #f4f4f5;
  color: var(--text-main);
  display: none;
}
#cancel-btn:hover { background: #e4e4e7; }

/* Lista de tareas */
.lista {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.2rem;
}

.item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1.2rem;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: slideUp 0.3s ease-out;
}
.item:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.item-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 8px;
}

/* Checkbox estilo Moderno */
.item input[type=checkbox] {
  appearance: none;
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border: 2px solid #d1d5db;
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
  position: relative;
  margin-top: 2px;
}
.item input[type=checkbox]:checked {
  background: var(--success);
  border-color: var(--success);
}
.item input[type=checkbox]:checked::after {
  content: '';
  position: absolute;
  left: 6px; top: 3px;
  width: 5px; height: 10px;
  border: 2px solid #fff;
  border-top: none; border-left: none;
  transform: rotate(45deg);
}

.item-title {
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--text-main);
  line-height: 1.3;
}
.item.done {
  background: #f8fafc;
  border-color: #e2e8f0;
}
.item.done .item-title {
  text-decoration: line-through;
  color: var(--text-muted);
}
.item-desc {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 12px;
  padding-left: 34px;
}
.item-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
  padding-left: 34px;
}
.item-date {
  font-size: 0.75rem;
  font-weight: 600;
  color: #94a3b8;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Botones de acción en la tarjeta */
.item-actions {
  display: flex;
  gap: 6px;
}
.act-btn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.act-btn:hover {
  background: var(--bg-app);
  color: var(--text-main);
}
.act-btn.del:hover {
  background: var(--danger-light);
  color: var(--danger);
  border-color: var(--danger-light);
}
.act-btn svg { width: 15px; height: 15px; }

/* Empty state */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 2rem;
  background: var(--bg-card);
  border: 1px dashed #cbd5e1;
  border-radius: var(--radius-lg);
  color: var(--text-muted);
  display: none;
}
.empty svg {
  width: 50px;
  height: 50px;
  color: #94a3b8;
  margin-bottom: 1rem;
}
.empty p { font-size: 1rem; line-height: 1.5; }
.empty strong { color: var(--text-main); font-size: 1.1rem; display: block; margin-bottom: 4px;}

/* Notificaciones Flash */
#flash {
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 100;
  padding: 14px 24px;
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-weight: 600;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
  transform: translateY(150%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
#flash.show { transform: translateY(0); }
#flash.ok { background: #10b981; color: white; }
#flash.err { background: #ef4444; color: white; }

/* ── Responsive ────────────────────────────────────── */
@media (max-width: 900px) {
  body { flex-direction: column; overflow: auto; }
  .sidebar { width: 100%; padding: 1.5rem; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .brand { margin-bottom: 0; }
  .stats-grid { display: flex; gap: 8px; margin-bottom: 0; width: 100%; margin-top: 1rem; }
  .stat-box { flex: 1; padding: 0.75rem; }
  .sidebar-footer { display: none; }
  .main { padding: 1.5rem; }
  .header-bar { flex-direction: column; align-items: stretch; }
  .tabs { justify-content: center; }
  #frm { flex-direction: column; }
  .input-group, .form-actions { width: 100%; }
  #frm button { width: 100%; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="brand">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      Control de Operaciones
    </h1>
    <p>Arquitectura: Python / SQL / Web Server</p>
  </div>

  <div class="stats-grid">
    <div class="stat-box active">
      <span>Global</span>
      <strong id="n-all">0</strong>
    </div>
    <div class="stat-box">
      <span>En Curso</span>
      <strong id="n-pend">0</strong>
    </div>
    <div class="stat-box">
      <span>Concluidas</span>
      <strong id="n-done">0</strong>
    </div>
  </div>

  <div class="sidebar-footer">
    Laboratorio de Implementación Continua
  </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main">
  
  <div class="header-bar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="buscar" type="search" placeholder="Localizar registros...">
    </div>

    <div class="tabs">
      <button class="on" data-f="all">Global</button>
      <button data-f="pend">En Curso</button>
      <button data-f="done">Concluidas</button>
    </div>
  </div>

  <!-- Formulario -->
  <div class="form-card">
    <h2>Ingresar nuevo registro</h2>
    <form id="frm" autocomplete="off">
      <div class="input-group">
        <input id="inp-titulo" placeholder="Asunto principal del registro..." required maxlength="255">
        <input id="inp-desc" placeholder="Detalles u observaciones...">
      </div>
      <div class="form-actions">
        <button type="submit" id="save-btn">Registrar</button>
        <button type="button" id="cancel-btn">Descartar</button>
      </div>
    </form>
  </div>

  <!-- Lista -->
  <ul class="lista" id="lista"></ul>

  <!-- Estado Vacío -->
  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
    <p id="empty-msg"><strong>Base de datos vacía</strong>No existen registros en esta vista.</p>
  </div>

</main>

<div id="flash"></div>

<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
