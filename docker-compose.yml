version: '3.8'

services:
  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: gestor_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestor_db
      MYSQL_USER: gestor_user
      MYSQL_PASSWORD: CambiameYa2024!
    volumes:
      - db_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "3306:3306"

  web:
    build: .
    platform: linux/amd64
    container_name: gestor_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=gestor_db
      - DB_USER=gestor_user
      - DB_PASSWORD=CambiameYa2024!
    depends_on:
      - db

volumes:
  db_data:
